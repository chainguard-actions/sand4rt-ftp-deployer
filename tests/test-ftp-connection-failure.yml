name: Test FTP connection failure (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a local folder so the action doesn't fail on missing local_folder
      - name: Create local dist folder
        run: mkdir -p dist && echo "hello" > dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: 21
          username: "invalid-user"
          password: "invalid-password"
          local_folder: "dist"
          remote_folder: "/"
          sftp: false
          cleanup: false

      - name: Assert action failed due to connection error (not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot connect to FTP server
          # (not because of missing/invalid inputs)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to connection error, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (no FTP server available)"

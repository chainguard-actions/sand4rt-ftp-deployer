name: Test FTP Deployer - SFTP mode invalid host fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local folder with test files
        run: |
          mkdir -p dist
          echo "hello world" > dist/index.html

      - id: deploy
        name: Run FTP Deployer in SFTP mode with invalid host
        uses: .
        continue-on-error: true
        with:
          sftp: "true"
          host: "192.0.2.1"
          port: 22
          username: "testuser"
          password: "testpass"
          local_folder: "dist"
          remote_folder: "/"

      - name: Assert action failed on invalid SFTP host
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SFTP host, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when connecting to invalid SFTP host"

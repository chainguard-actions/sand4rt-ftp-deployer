name: Test SFTP mode deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom local folder with files to deploy
        run: |
          mkdir -p build
          echo "<html><body>Test</body></html>" > build/index.html
          echo "style.css content" > build/style.css
          echo "Created build folder with test files"
          ls -la build/

      - name: Run FTP deployer action in SFTP mode (expect connection failure, not step failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          sftp: "true"
          host: "sftp.invalid.example.com"
          port: "22"
          username: "sftpuser"
          password: "sftppassword"
          local_folder: "build"
          remote_folder: "/var/www/html"
          cleanup: "false"

      - name: Assert SFTP action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should have attempted to run (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: SFTP action ran (outcome: ${{ steps.action.outcome }})"

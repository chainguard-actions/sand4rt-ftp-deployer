name: Test SFTP mode (connection error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local folder with test files
        run: |
          mkdir -p my-build
          echo "<html>test</html>" > my-build/index.html
          echo "body {}" > my-build/style.css

      - name: Run FTP deployer in SFTP mode (expects connection error, not crash)
        id: action
        # sftp: "true" is JSON.parse'd to boolean true in the action.
        # The action uses core.error() not core.setFailed(), so exits 0
        # even when the SFTP connection fails.
        uses: .
        with:
          sftp: "true"
          host: "127.0.0.1"
          port: 22
          username: "testuser"
          password: "testpass"
          local_folder: "my-build"
          remote_folder: "/"

      - name: Assert SFTP mode action completed without unhandled exception
        run: |
          echo "PASS: SFTP mode action step completed (core.error used, not core.setFailed)"

name: Test include/exclude pattern inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a local folder with some files
      - name: Create local dist folder with files
        run: |
          mkdir -p dist/css dist/js
          echo "body {}" > dist/css/style.css
          echo "console.log('hi')" > dist/js/app.js
          echo "<html></html>" > dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: 21
          username: "testuser"
          password: "testpass"
          local_folder: "dist"
          remote_folder: "/public"
          sftp: false
          cleanup: false
          include: '["*.html", "css/**", "js/**"]'
          exclude: '["*.map", ".git/**"]'
          passive: true

      - name: Assert action failed due to connection (not input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot connect to FTP server,
          # NOT because of JSON parsing errors in include/exclude inputs.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to connection error, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at connection stage (inputs parsed correctly)"

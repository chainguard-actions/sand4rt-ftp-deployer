name: Test basic FTP deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local folder with files to deploy
        run: |
          mkdir -p dist
          echo "hello world" > dist/index.html
          echo "Created dist folder with test files"
          ls -la dist/

      - name: Run FTP deployer action (expect connection failure, not step failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          host: "ftp.invalid.example.com"
          username: "testuser"
          password: "testpassword"
          local_folder: "dist"
          remote_folder: "/public_html"
          cleanup: "false"

      - name: Assert action ran (connection error is expected with fake credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action uses core.error() not core.setFailed(), so it may succeed or fail
          # Either way, the action should have attempted to run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"

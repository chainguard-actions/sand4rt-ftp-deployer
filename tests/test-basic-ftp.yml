name: Test basic FTP deployment (connection error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local dist folder with a test file
        run: |
          mkdir -p dist
          echo "hello world" > dist/index.html

      - name: Run FTP deployer action (expects connection error, not crash)
        id: action
        # The action uses core.error() not core.setFailed(), so it exits 0
        # even when the FTP connection fails. We verify it doesn't throw
        # an unhandled exception (which would exit non-zero).
        uses: .
        with:
          host: "127.0.0.1"
          port: 9999
          username: "testuser"
          password: "testpass"
          local_folder: "dist"
          remote_folder: "/upload"
          cleanup: "false"

      - name: Assert action completed without unhandled exception
        run: |
          echo "PASS: action step completed (core.error used, not core.setFailed)"
